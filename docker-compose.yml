services:
  lab-dashboard:
    image: ghcr.io/YOUR_GITHUB_USERNAME/lab.rtin.page:latest
    container_name: lab-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      CONFIG_PATH: /config/services.yaml
    volumes:
      - ./config:/config:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
